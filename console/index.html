<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuff AI Console</title>
<meta name="description" content="Manage your company's AI agents, workstations, people and policies.">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="console.css">
</head>
<body>
<div id="boot" class="center"><div class="spinner" aria-label="Loading"></div></div>

<!-- sign in -->
<main id="signin" class="center" hidden>
  <div class="auth">
    <div class="brandrow"><svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><use href="#emblem"/></svg><span class="brand">Cuff AI <b>Console</b></span></div>
    <h1>Sign in</h1>
    <p class="muted">Manage your company's AI agents, workstations and people. We'll email you a code.</p>
    <form id="emailf" class="stack">
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@company.com">
      <button class="btn primary">Email me a code</button>
    </form>
    <form id="codef" class="stack" hidden>
      <label for="code">6-digit code from your email</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <button class="btn primary">Sign in</button>
      <button class="btn ghost" type="button" id="back">Use a different email</button>
    </form>
    <p class="err" id="autherr" role="alert"></p>
  </div>
</main>

<!-- choose or create an organisation -->
<main id="orgs" class="center" hidden>
  <div class="auth wide">
    <div class="brandrow"><svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><use href="#emblem"/></svg><span class="brand">Cuff AI <b>Console</b></span>
      <button class="btn ghost sm right" id="signout1">Sign out</button></div>
    <h1>Your organisations</h1>
    <div id="invitebox"></div>
    <ul class="orglist" id="orglist"></ul>
    <form id="neworg" class="row">
      <input id="orgname" placeholder="New organisation name" aria-label="New organisation name" required maxlength="120">
      <button class="btn primary">Create organisation</button>
    </form>
    <p class="muted small">Creating an organisation makes you its super admin and generates its policy-signing key.</p>
    <p class="err" id="orgerr" role="alert"></p>
  </div>
</main>

<!-- the console -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brandrow"><svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><use href="#emblem"/></svg><span class="brand">Cuff AI</span></div>
    <button class="orgswitch" id="orgswitch" title="Switch organisation"><span id="orgname2"></span><small id="myrole"></small></button>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="sidefoot"><span id="whoami"></span><button class="btn ghost sm" id="signout2">Sign out</button></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="modalwrap" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <h2 id="mtitle"></h2><div id="mbody"></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="eg" gradientUnits="userSpaceOnUse" x1="100" y1="175" x2="100" y2="25"><stop offset="0" stop-color="#16A6B8"/><stop offset=".3" stop-color="#2EB872"/><stop offset=".5" stop-color="#9FBF1F"/><stop offset=".7" stop-color="#F2A516"/><stop offset=".85" stop-color="#FA6A2A"/><stop offset="1" stop-color="#F2364A"/></linearGradient>
  <g id="emblem"><path d="M149.5 149.5A70 70 0 1 1 149.5 50.5" fill="none" stroke="url(#eg)" stroke-width="28" stroke-linecap="round"/><circle cx="100" cy="100" r="18" fill="#E8ECF2"/></g>
</defs></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="console.js"></script>
</body>
</html>
